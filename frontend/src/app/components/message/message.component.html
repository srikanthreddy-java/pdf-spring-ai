<div class="message" [class.user]="message.sender === 'user'" [class.bot]="message.sender === 'bot'">
  <div class="content">
    <p>{{ message.content }}</p>
    <div *ngIf="message.file" class="file-attachment">
      <span class="file-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V9M13 2L20 9M13 2V9H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="file-name">{{ message.file.name }}</span>
      <span class="file-size">{{ message.file.size / 1024 | number:'1.0-1' }} KB</span>
    </div>
  </div>
  <div class="timestamp">{{ message.timestamp | date:'shortTime' }}</div>
</div>
