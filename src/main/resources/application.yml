spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        model: gpt-6-luna
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      include-stacktrace: never
      include-binding-errors: always
      include-message: always
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,application/x-www-form-urlencoded,multipart/form-data
    min-response-size: 1024

# File upload settings
file:
  uploadDir: uploads/
  allowedTypes: application/pdf
